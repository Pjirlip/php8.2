name: Build and publish php-fpm and httpd images

# Branch "fpm": builds two images from this repository and publishes them under their own names
# (php8.2-fpm, php8.2-httpd) with "latest", "fpm" and sha-<short> tags. The package of the mod_php
# image (php8.2:latest) is not touched. A manual run publishes the given extra tag.
on:
  push:
    branches:
      - fpm
    paths-ignore:
      - 'README.md'
      - 'cron-jobs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional tag to publish (e.g. production)"
        required: true
        default: production
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php8.2-fpm
            dockerfile: Dockerfile
          - image: php8.2-httpd
            dockerfile: Dockerfile.httpd
    concurrency:
      group: docker-build-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # always resolve the FROM tag against the registry so a rebuild picks up the newest base image
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
