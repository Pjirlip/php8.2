Mutex file:${APACHE_LOCK_DIR} default
PidFile ${APACHE_PID_FILE}
# Idle network timeout per read/write, not total request time: frees workers held by dead clients (H4)
Timeout ${APACHE_TIMEOUT}
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
# Upper bound for a graceful stop (SIGWINCH), triggered by entrypoint.sh on SIGTERM (H1)
GracefulShutdownTimeout 25
User propeller
Group propeller
HostnameLookups Off
TraceEnable Off
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
#Include ports.conf
ServerName ${APACHE_SERVER_NAME}

# Logging straight to the container streams: errors to stderr, access to stdout.
# No log files, no supervisor pipe, no report generation in the container (H5).
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{X-Forwarded-For}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" proxy_combined
SetEnvIf Request_URI "^/(healthz|server-status)" dontlog
CustomLog /proc/self/fd/1 proxy_combined env=!dontlog

Options -Indexes
Listen ${PORT}

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>
<Directory /usr/share>
    AllowOverride None
    Require all granted
</Directory>

AccessFileName .htaccess

<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

<FilesMatch "^\.sql">
    Require all denied
</FilesMatch>

# Static health endpoint served from the image filesystem, independent of NFS and database.
# It only answers when a prefork worker is free, which is exactly the failure mode to detect (H3).
Alias /healthz /opt/propeller/healthz/index.html
<Directory /opt/propeller/healthz>
    Require all granted
</Directory>

IncludeOptional conf-enabled/*.conf
IncludeOptional sites-enabled/*

# Placed after conf-enabled: the base image's docker-php.conf allows .htaccess for the whole
# /var/www tree, which costs a stat() per directory level and request on NFS (K2).
# The DocumentRoot itself is configured in 000-default.conf.
<Directory /var/www/>
    AllowOverride None
</Directory>

# Placed after conf-enabled/security.conf, which would otherwise reset these to "OS" / "On"
ServerSignature Off
ServerTokens Prod
