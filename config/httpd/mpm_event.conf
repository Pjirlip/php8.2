# event MPM: connections are handled by threads, PHP runs in the php-fpm container. MaxRequestWorkers is the
# number of concurrent connections (threads), not of PHP processes, so a modest value serves a site easily.
<IfModule mpm_event_module>
    StartServers             1
    ServerLimit              16
    ThreadLimit              64
    ThreadsPerChild          ${APACHE_THREADS_PER_CHILD}
    MinSpareThreads          10
    MaxSpareThreads          50
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   0
    AsyncRequestWorkerFactor 2
</IfModule>
