<VirtualHost *:${PORT}>

	ServerAdmin admin@propeller.de
	DocumentRoot ${DOCUMENT_ROOT}

	<Directory ${DOCUMENT_ROOT}>
		# -MultiViews: content negotiation does a readdir() for every non-exact path (every rewritten
		# WordPress/TYPO3 URL) on NFS and interferes with mod_rewrite front controllers (K2)
		Options -Indexes +FollowSymLinks -MultiViews
		# "All" keeps project .htaccess files working. Set APACHE_ALLOW_OVERRIDE=None and ship the
		# rewrite/header rules via /etc/apache2/site.d/*.conf to drop the per-request lookups (K2).
		AllowOverride ${APACHE_ALLOW_OVERRIDE}
		Require all granted
	</Directory>

	# Upload/asset trees: static delivery only, no .htaccess lookups, no PHP execution (K2).
	# Blocks for paths that do not exist in a project are harmless.
	<Directory ${DOCUMENT_ROOT}/fileadmin>
		AllowOverride None
		php_admin_flag engine off
	</Directory>
	<Directory ${DOCUMENT_ROOT}/fileadmin/_temp_>
		Require all denied
	</Directory>
	<Directory ${DOCUMENT_ROOT}/typo3temp/assets>
		AllowOverride None
		php_admin_flag engine off
	</Directory>
	<Directory ${DOCUMENT_ROOT}/wp-content/uploads>
		AllowOverride None
		php_admin_flag engine off
	</Directory>

	# Per-site Apache rules mounted from a ConfigMap (replacement for .htaccess with APACHE_ALLOW_OVERRIDE=None)
	IncludeOptional /etc/apache2/site.d/*.conf

</VirtualHost>
