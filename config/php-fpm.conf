; Global php-fpm settings. The pool (/usr/local/etc/php-fpm.d/zz-propeller.conf) is written by entrypoint.sh
; from environment variables at container start.
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192
; Graceful stop (SIGQUIT): in-flight requests may finish for this long before children are killed (H1)
process_control_timeout = 25s
include = /usr/local/etc/php-fpm.d/*.conf
