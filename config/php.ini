[global]

file_uploads = On
allow_url_fopen = On
max_execution_time = ${PHP_MAX_EXEC_TIME}
max_input_vars = 1500
upload_max_filesize = ${PHP_POST_AND_UPLOAD_MAX_SIZE}
post_max_size = ${PHP_POST_AND_UPLOAD_MAX_SIZE}
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = ${PHP_MEMORY_LIMIT}
date.timezone = ${TZ}

; PHP errors go through the Apache ErrorLog (stderr); error_log is intentionally unset (H5)

; Mail via msmtp configured by arguments: no config file written at runtime, works for the
; web pod and for CronJob pods alike (H2)
sendmail_path = "/usr/bin/msmtp --host=${SMTP_SERVER} --port=${SMTP_PORT} --from=${SMTP_FROM} --tls=off --auth=off -t"

; Temporary and session data stay in the container, never on the NFS webroot (K2)
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
session.save_path = /tmp

; realpath cache is per process: fewer stat()/readlink() calls on NFS (K2)
realpath_cache_size = 8M
realpath_cache_ttl = 600

; A worker blocked on MySQL must not hang for a day (mysqlnd default: 86400 s) (H4)
default_socket_timeout = 60
mysqlnd.net_read_timeout = ${PHP_MYSQLND_NET_READ_TIMEOUT}
; Persistent connections would multiply (workers x pods) idle MySQL connections (H4)
mysqli.allow_persistent = Off

; OPcache, shared by all prefork children (K2)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_FILES}
opcache.max_wasted_percentage = 10
; validate_timestamps=1 with revalidate_freq=60: in-place deploys on NFS are picked up within a minute
; instead of a stat() on every file every 2 seconds
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}
; opcache.file_cache stays unset: a second-level file cache on NFS would re-introduce the I/O removed above
