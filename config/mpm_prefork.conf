# prefork sizing (K1). entrypoint.sh derives APACHE_MAX_REQUEST_WORKERS from the container memory limit:
#   MaxRequestWorkers = floor((limit_MiB - APACHE_BASELINE_MEMORY_MB) / APACHE_CHILD_MEMORY_MB)
# Set APACHE_MAX_REQUEST_WORKERS explicitly to override. ServerLimit == MaxRequestWorkers makes the cap hard.
<IfModule mpm_prefork_module>
    StartServers            ${APACHE_MIN_SPARE_SERVERS}
    MinSpareServers         ${APACHE_MIN_SPARE_SERVERS}
    MaxSpareServers         ${APACHE_MAX_SPARE_SERVERS}
    ServerLimit             ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
    # Recycle children: bounds memory growth of long-lived mod_php processes
    MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
